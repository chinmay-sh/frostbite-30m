# Frostbite-30M architecture hyperparameters (PLAN.md §2.1)
# All values in one place; code reads config, never hard-codes numbers.

model:
  d_model: 320          # widened from PLAN's 256 per D14 (measured: -17% inference latency, same VRAM)
  n_blocks: 6           # Reinforced Liquid Blocks
  n_heads: 4            # per-block multi-head attention (head_dim = 80)
  dropout: 0.1
  param_cap: 30_000_000  # hard limit enforced by tests/test_param_count.py

embedding:
  sensor_dim: 128       # raw input features per timestep
  max_len: 1024         # max sequence length (positional encoding table size)

attention:
  causal: true          # causal mask for time-series

cfc:
  units: 320            # tracks d_model: liquid state width = model width
  mode: "default"       # ncps CfC mode: default | pure | no_gate
  backbone_units: 2242  # calibrated so the full model lands at ~29.4M (D13/D14)
  backbone_layers: 1
  mixed_memory: false   # enable LSTM-augmented CfC if long-term memory needed

router:
  hidden_dim: 320       # 2-layer MLP hidden width (Auto-RL cell); ~0.5M total
  # Actions: 0=ROUTE, 1=SKIP, 2=HALT

cortex:
  choice_dim: 8         # global routing choices (Choice head)
  hidden_dim: 256

# Approximate per-module upper bounds (PLAN §2.1); enforced by tests/test_param_count.py.
budgets:
  embedding: 400_000          # PLAN table says 8.2M — unreachable with sensor_dim=128 (see D11)
  attention_per_block: 420_000
  cfc_per_block: 4_600_000
